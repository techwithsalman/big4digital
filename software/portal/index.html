      // Sector pre-selection from URL query parameters (?sector=RESTAURANT|CLINIC_HMS|PHARMACY|RETAIL_MART)
      try {
        const _p = new URLSearchParams(window.location.search);
        const _s = _p.get('sector') || _p.get('vertical') || _p.get('plan');
        if (_s) {
          const _u = _s.toUpperCase();
          let _mapped = 'RETAIL_MART';
          if (_u.includes('REST')) _mapped = 'RESTAURANT';
          else if (_u.includes('CLIN') || _u.includes('HOSP')) _mapped = 'CLINIC_HMS';
          else if (_u.includes('PHARM') || _u.includes('MED')) _mapped = 'PHARMACY';
          else if (_u.includes('RETAIL') || _u.includes('MART')) _mapped = 'RETAIL_MART';
          localStorage.setItem('digitalsnova_active_sector', _mapped);
        }
      } catch (e) {}
    </script>

      (function() {
        try {
          var banner = document.getElementById('dn-portal-announcement');
          if (!banner) return;
          var dismissedKey = 'dn_portal_announcement_dismissed_v22';
          if (localStorage.getItem(dismissedKey) === 'true') {
            banner.style.display = 'none';
          }
          var closeBtn = document.getElementById('dn-close-portal-announcement');
          if (closeBtn) {
            closeBtn.addEventListener('click', function() {
              banner.style.display = 'none';
              try { localStorage.setItem(dismissedKey, 'true'); } catch(e) {}
            });
          }
        } catch(e) {}
      })();

    <script>
      // Register Offline PWA Service Worker with zero HTTP cache lag + auto-update signaling
      if ('serviceWorker' in navigator) {
        window._dnHadSwController = Boolean(navigator.serviceWorker.controller);
        window.addEventListener('load', () => {
          const isPortalPath = window.location.pathname.startsWith('/portal');
          const swUrl = isPortalPath ? './sw.js' : '/sw.js';
          const swOpts = isPortalPath ? { updateViaCache: 'none' } : { scope: '/', updateViaCache: 'none' };
          navigator.serviceWorker.register(swUrl, swOpts).then((reg) => {
            window._dnSwReg = reg;
            console.log('[PWA] Service Worker v21 registered:', reg.scope);
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  nw.postMessage({ type: 'SKIP_WAITING' });
                  window.dispatchEvent(new CustomEvent('dn-sw-updated', { detail: { version: 'v21' } }));
                }
              });
            });
            reg.update().catch(() => {});
          }).catch((err) => {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
        });
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (window._dnHadSwController) {
            window.dispatchEvent(new CustomEvent('dn-sw-updated', { detail: { version: 'v21' } }));
          }
          window._dnHadSwController = true;
        });
        navigator.serviceWorker.addEventListener('message', (ev) => {
          if (ev.data && ev.data.type === 'SW_UPDATED' && window._dnHadSwController) {
            window.dispatchEvent(new CustomEvent('dn-sw-updated', { detail: ev.data }));
          }
        });
      }

      // Capture beforeinstallprompt & appinstalled for Desktop (Chrome/Edge) and Android WebAPK
      window.deferredPwaPrompt = null;
      window._deferredPwaPrompt = null;
      window._pwaInstalled = Boolean(
        (window.matchMedia && (
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: window-controls-overlay)').matches
        )) || window.navigator.standalone === true
      );
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        window._deferredPwaPrompt = e;
        window._pwaInstalled = false;
        window.dispatchEvent(new CustomEvent('pwa-install-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.deferredPwaPrompt = null;
        window._deferredPwaPrompt = null;
        window._pwaInstalled = true;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
